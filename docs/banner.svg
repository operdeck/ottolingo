<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff4e6"/>
      <stop offset="50%" style="stop-color:#dff6ef"/>
      <stop offset="100%" style="stop-color:#ecfeff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="80" cy="40" r="60" fill="#ffd8a8" opacity="0.4"/>
  <circle cx="820" cy="160" r="80" fill="#99f6e4" opacity="0.3"/>
  <circle cx="450" cy="190" r="50" fill="#c7d2fe" opacity="0.25"/>

  <!-- Person 1 - studying Arabic -->
  <g transform="translate(110, 70)">
    <circle cx="0" cy="0" r="18" fill="#f4a261"/>
    <rect x="-14" y="20" width="28" height="40" rx="8" fill="#0f766e"/>
    <rect x="-22" y="50" width="20" height="14" rx="2" fill="#264653" transform="rotate(-10, -12, 57)"/>
    <rect x="2" y="50" width="20" height="14" rx="2" fill="#2a9d8f" transform="rotate(10, 12, 57)"/>
  </g>
  <!-- Arabic text floating -->
  <text x="155" y="60" font-family="serif" font-size="26" fill="#264653" opacity="0.8">مرحبا</text>
  <text x="140" y="128" font-family="serif" font-size="20" fill="#0f766e" opacity="0.6">كتاب</text>

  <!-- Center logo area -->
  <text x="450" y="88" font-family="sans-serif" font-size="36" font-weight="bold" fill="#132a2b" text-anchor="middle">Ottolingo</text>
  <text x="450" y="118" font-family="sans-serif" font-size="13" fill="#0f766e" text-anchor="middle">Leer Arabisch, Japans &amp; Italiaans</text>

  <!-- Hiragana floating -->
  <text x="590" y="55" font-family="sans-serif" font-size="28" fill="#7c3aed" opacity="0.8">あ</text>
  <text x="632" y="88" font-family="sans-serif" font-size="20" fill="#0f766e" opacity="0.6">こんにちは</text>
  <text x="600" y="138" font-family="sans-serif" font-size="18" fill="#f97316" opacity="0.7">さくら</text>

  <!-- Person 2 - studying Japanese -->
  <g transform="translate(760, 75)">
    <circle cx="0" cy="0" r="18" fill="#e9c46a"/>
    <rect x="-14" y="20" width="28" height="40" rx="8" fill="#7c3aed"/>
    <rect x="-8" y="48" width="16" height="20" rx="2" fill="#fefce8"/>
    <line x1="-4" y1="53" x2="4" y2="53" stroke="#a3a3a3" stroke-width="1"/>
    <line x1="-4" y1="57" x2="4" y2="57" stroke="#a3a3a3" stroke-width="1"/>
    <line x1="-4" y1="61" x2="4" y2="61" stroke="#a3a3a3" stroke-width="1"/>
  </g>

  <!-- Person 3 - studying Italian (centre-right) -->
  <g transform="translate(450, 152)">
    <circle cx="0" cy="0" r="15" fill="#a78bfa"/>
    <rect x="-11" y="17" width="22" height="32" rx="7" fill="#16a34a"/>
    <!-- small Italian book: green/white/red stripes -->
    <rect x="-17" y="35" width="8" height="11" rx="2" fill="#16a34a"/>
    <rect x="-13" y="35" width="8" height="11" rx="2" fill="#ffffff" opacity="0.9"/>
    <rect x="-9" y="35" width="8" height="11" rx="2" fill="#dc2626"/>
  </g>
  <!-- Italian text floating -->
  <text x="330" y="155" font-family="sans-serif" font-size="18" fill="#16a34a" opacity="0.75">Ciao!</text>
  <text x="485" y="165" font-family="sans-serif" font-size="15" fill="#dc2626" opacity="0.65">buongiorno</text>

  <!-- Decorative elements -->
  <text x="300" y="170" font-size="16" fill="#f97316" opacity="0.5">★</text>
  <text x="560" y="40" font-size="14" fill="#0f766e" opacity="0.5">✦</text>
  <text x="390" y="42" font-size="12" fill="#7c3aed" opacity="0.4">●</text>
  <!-- Small floating cards -->
  <rect x="220" y="138" width="50" height="28" rx="6" fill="white" opacity="0.7" stroke="#99f6e4" stroke-width="1"/>
  <text x="245" y="156" font-size="10" fill="#132a2b" text-anchor="middle" font-family="sans-serif">نعم ✓</text>
  <rect x="680" y="148" width="50" height="28" rx="6" fill="white" opacity="0.7" stroke="#c4b5fd" stroke-width="1"/>
  <text x="705" y="166" font-size="10" fill="#132a2b" text-anchor="middle" font-family="sans-serif">はい ✓</text>
  <rect x="450" y="32" width="50" height="28" rx="6" fill="white" opacity="0.65" stroke="#bbf7d0" stroke-width="1"/>
  <text x="475" y="50" font-size="10" fill="#132a2b" text-anchor="middle" font-family="sans-serif">sì ✓</text>
</svg>
