<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff4e6"/>
      <stop offset="50%" style="stop-color:#dff6ef"/>
      <stop offset="100%" style="stop-color:#ecfeff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="80" cy="40" r="60" fill="#ffd8a8" opacity="0.4"/>
  <circle cx="720" cy="160" r="80" fill="#99f6e4" opacity="0.3"/>
  <!-- Person 1 - studying Arabic -->
  <g transform="translate(120, 70)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="#f4a261"/>
    <!-- Body -->
    <rect x="-14" y="20" width="28" height="40" rx="8" fill="#0f766e"/>
    <!-- Book -->
    <rect x="-22" y="50" width="20" height="14" rx="2" fill="#264653" transform="rotate(-10, -12, 57)"/>
    <rect x="2" y="50" width="20" height="14" rx="2" fill="#2a9d8f" transform="rotate(10, 12, 57)"/>
  </g>
  <!-- Arabic text floating -->
  <text x="180" y="60" font-family="serif" font-size="28" fill="#264653" opacity="0.8">مرحبا</text>
  <text x="160" y="130" font-family="serif" font-size="22" fill="#0f766e" opacity="0.6">كتاب</text>
  <!-- Center logo area -->
  <text x="400" y="90" font-family="sans-serif" font-size="36" font-weight="bold" fill="#132a2b" text-anchor="middle">Ottolingo</text>
  <text x="400" y="120" font-family="sans-serif" font-size="14" fill="#0f766e" text-anchor="middle">Leer Arabisch &amp; Japans</text>
  <!-- Hiragana floating -->
  <text x="560" y="55" font-family="sans-serif" font-size="30" fill="#7c3aed" opacity="0.8">あ</text>
  <text x="620" y="90" font-family="sans-serif" font-size="24" fill="#0f766e" opacity="0.6">こんにちは</text>
  <text x="580" y="140" font-family="sans-serif" font-size="20" fill="#f97316" opacity="0.7">さくら</text>
  <!-- Person 2 - studying Japanese -->
  <g transform="translate(680, 75)">
    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="#e9c46a"/>
    <!-- Body -->
    <rect x="-14" y="20" width="28" height="40" rx="8" fill="#7c3aed"/>
    <!-- Notebook -->
    <rect x="-8" y="48" width="16" height="20" rx="2" fill="#fefce8"/>
    <line x1="-4" y1="53" x2="4" y2="53" stroke="#a3a3a3" stroke-width="1"/>
    <line x1="-4" y1="57" x2="4" y2="57" stroke="#a3a3a3" stroke-width="1"/>
    <line x1="-4" y1="61" x2="4" y2="61" stroke="#a3a3a3" stroke-width="1"/>
  </g>
  <!-- Decorative elements -->
  <text x="300" y="170" font-size="16" fill="#f97316" opacity="0.5">★</text>
  <text x="500" y="40" font-size="14" fill="#0f766e" opacity="0.5">✦</text>
  <text x="350" y="45" font-size="12" fill="#7c3aed" opacity="0.4">●</text>
  <!-- Small floating cards -->
  <rect x="240" y="140" width="50" height="30" rx="6" fill="white" opacity="0.7" stroke="#99f6e4" stroke-width="1"/>
  <text x="265" y="160" font-size="10" fill="#132a2b" text-anchor="middle" font-family="sans-serif">نعم ✓</text>
  <rect x="510" y="150" width="50" height="30" rx="6" fill="white" opacity="0.7" stroke="#c4b5fd" stroke-width="1"/>
  <text x="535" y="170" font-size="10" fill="#132a2b" text-anchor="middle" font-family="sans-serif">はい ✓</text>
</svg>
